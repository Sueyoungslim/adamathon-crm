name: Sync Ponty candidates

on:
  schedule:
    - cron: '0 8 */3 * *'   # 8:00 UTC every 3rd day
  workflow_dispatch:         # allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Fetch candidates from Ponty
        run: node scripts/sync.js
        env:
          PONTY_EMAIL: ${{ secrets.PONTY_EMAIL }}
          PONTY_PASSWORD: ${{ secrets.PONTY_PASSWORD }}

      - name: Install Anthropic SDK
        run: npm install @anthropic-ai/sdk

      - name: Tier candidates with AI
        run: node scripts/tier.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PONTY_EMAIL: ${{ secrets.PONTY_EMAIL }}
          PONTY_PASSWORD: ${{ secrets.PONTY_PASSWORD }}

      - name: Commit updated candidates.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: sync candidates from Ponty'
          file_pattern: public/candidates.json

      - name: Trigger Netlify deploy
        run: curl -s -X POST ${{ secrets.NETLIFY_BUILD_HOOK }}


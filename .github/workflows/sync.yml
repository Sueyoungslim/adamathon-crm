name: Sync Ponty candidates

on:
  schedule:
    - cron: '0 8 */3 * *'   # 8:00 UTC every 3rd day
  workflow_dispatch:         # allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch candidates from Ponty
        run: node scripts/sync.js
        env:
          PONTY_CLIENT_ID: ${{ secrets.PONTY_CLIENT_ID }}
          PONTY_CLIENT_SECRET: ${{ secrets.PONTY_CLIENT_SECRET }}

      - name: Commit updated candidates.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: sync candidates from Ponty'
          file_pattern: public/candidates.json
